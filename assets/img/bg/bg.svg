<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a35"/>
      <stop offset=".55" stop-color="#4a5a52"/>
      <stop offset="1" stop-color="#1c2420"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="22%" r="30%">
      <stop offset="0" stop-color="#c9d8c4" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c9d8c4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb3a5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9fb3a5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9fb3a5" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <circle cx="1190" cy="230" r="120" fill="none" stroke="#d7e4d2" stroke-opacity=".35" stroke-width="10"/>
  <!-- distant cliffs -->
  <path d="M0 640 L180 520 300 560 420 430 520 470 640 380 700 300 730 380 820 460 960 520 1100 470 1240 540 1400 480 1560 560 1720 500 1920 580 1920 1080 0 1080z" fill="#34433c" opacity=".85"/>
  <!-- ruined towers -->
  <g fill="#26302b">
    <path d="M640 640V300l20-60 20 60v340z"/>
    <path d="M700 640V360l14-40 14 40v280z"/>
    <path d="M560 640V420h40v-30h20v250z"/>
    <path d="M760 640V430l30-20 10 40v190z"/>
  </g>
  <rect y="560" width="1920" height="220" fill="url(#fog)" filter="url(#blur)"/>
  <!-- mid ground -->
  <path d="M0 760 C240 700 420 740 640 720 S1080 660 1300 720 1700 690 1920 740V1080H0z" fill="#202a25"/>
  <!-- dead tree -->
  <g stroke="#141b17" stroke-linecap="round" fill="none">
    <path d="M1480 1080 C1470 900 1490 760 1460 560" stroke-width="34"/>
    <path d="M1466 700 C1520 640 1580 620 1640 560" stroke-width="14"/>
    <path d="M1462 620 C1420 560 1380 540 1330 470" stroke-width="12"/>
    <path d="M1460 560 C1470 480 1450 420 1470 330" stroke-width="10"/>
    <path d="M1600 590 l40 -70" stroke-width="7"/>
  </g>
  <!-- path and lone figure -->
  <path d="M760 1080 C820 960 900 880 960 820 L990 820 C1000 900 1060 980 1180 1080z" fill="#3a4842" opacity=".7"/>
  <g transform="translate(965 760)">
    <path d="M-16 60 L-10 0 Q0 -14 10 0 L16 60z" fill="#7a2a22"/>
    <circle cx="0" cy="-8" r="7" fill="#1a1a1a"/>
  </g>
  <!-- foreground -->
  <path d="M0 900 C300 860 500 940 760 920 S1300 960 1920 900V1080H0z" fill="#121813"/>
  <!-- floating leaves -->
  <g fill="#161d18">
    <path d="M400 200l18 8-10 14z"/><path d="M880 140l14 10-14 8z"/><path d="M1680 260l16 6-12 12z"/>
    <path d="M300 420l12 10-14 4z"/><path d="M1800 120l14 4-8 12z"/>
  </g>
</svg>
