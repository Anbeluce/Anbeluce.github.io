# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Open https://app.pagescms.org, sign in with GitHub and pick this repository.
# Every save is a commit; GitHub Actions then rebuilds the site.

media:
  input: assets/img
  output: /assets/img
  categories: [image, video, audio, document, font]
  rename: safe

content:
  # Visual editor for writing on a phone. Use "Bài viết" (Markdown) for posts with theme-specific syntax.
  - name: quick_posts
    label: Viết nhanh (soạn trực quan)
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    view:
      primary: title
      fields: [title, date]
      sort: date
      order: desc
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: description
        label: Mô tả ngắn
        type: text
      - name: date
        label: Ngày đăng
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss '+0700'"
      - name: categories
        label: Danh mục
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: image
        label: Ảnh bìa
        type: object
        fields:
          - name: path
            label: Ảnh
            type: image
            options:
              path: assets/img/posts
          - name: alt
            label: Mô tả ảnh
            type: string
      - name: pin
        label: Ghim lên đầu trang chủ
        type: boolean
      - name: body
        label: Nội dung
        type: rich-text
        options:
          format: markdown
          path: assets/img/posts
          rename: safe

  - name: posts
    label: Bài viết (Markdown)
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create
    view:
      primary: title
      fields: [title, date, categories]
      sort: date
      order: desc
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: description
        label: Mô tả ngắn (hiện trên card trang chủ)
        type: text
      - name: date
        label: Ngày đăng
        type: date
        required: true
        options:
          time: true
          # Jekyll reads a date without offset as UTC, so pin Vietnam time explicitly
          format: "yyyy-MM-dd HH:mm:ss '+0700'"
      - name: categories
        label: Danh mục
        description: "Tối đa 2 cấp: mục cha rồi mục con, ví dụ: Cyber Defenders → Threat Hunting"
        type: string
        list: true
      - name: tags
        label: Tags
        description: "Viết thường, nối bằng dấu gạch ngang, ví dụ: endpoint-forensics"
        type: string
        list: true
      - name: image
        label: Ảnh bìa
        type: object
        fields:
          - name: path
            label: Ảnh
            type: image
            options:
              path: assets/img/posts
          - name: alt
            label: Mô tả ảnh
            type: string
      - name: pin
        label: Ghim lên đầu trang chủ
        type: boolean
      - name: body
        label: Nội dung (Markdown)
        type: code
        options:
          format: markdown

  - name: about
    label: Trang About
    type: file
    path: _tabs/about.md
    format: yaml-frontmatter
    fields:
      - name: icon
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: body
        label: Nội dung (Markdown)
        type: code
        options:
          format: markdown

  - name: pinned_categories
    label: Card ghim trang chủ
    type: file
    path: _data/pinned_categories.yml
    format: yaml
    list: true
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: icon
        label: Icon Font Awesome
        description: "Ví dụ: fas fa-shield-halved — tra icon tại fontawesome.com/icons"
        type: string
      - name: category
        label: Danh mục liên kết
        description: Phải trùng với tên danh mục dùng trong bài viết
        type: string
        required: true
      - name: description
        label: Mô tả
        type: text
      - name: image
        label: Ảnh bìa
        type: image
        options:
          path: assets/img/posts

  - name: contact
    label: Icon mạng xã hội (sidebar)
    type: file
    path: _data/contact.yml
    format: yaml
    list: true
    fields:
      - name: type
        label: Tên
        type: string
        required: true
      - name: icon
        label: Icon Font Awesome
        type: string
      - name: url
        label: Link
        description: Để trống với github/email (lấy từ _config.yml)
        type: string
      - name: noblank
        label: Mở trong tab hiện tại
        type: boolean

  - name: status
    label: Trạng thái online (sidebar)
    type: file
    path: _data/status.yml
    format: yaml
    fields:
      - name: enabled
        label: Hiện khung trạng thái dưới tên blog
        type: boolean
      - name: github
        label: GitHub
        type: object
        fields:
          - name: enabled
            label: Hiện hoạt động gần nhất trên GitHub
            type: boolean
          - name: username
            label: Username GitHub
            type: string
      - name: discord
        label: Discord
        type: object
        fields:
          - name: enabled
            label: Hiện trạng thái online Discord
            description: "Phải tham gia server Lanyard trước: https://discord.gg/lanyard"
            type: boolean
          - name: user_id
            label: Discord User ID
            description: "Dãy số. Discord → Cài đặt → Nâng cao → bật Chế độ nhà phát triển, rồi chuột phải vào tên mình → Sao chép ID người dùng"
            type: string
          - name: show_activity
            label: Hiện đang chơi game / nghe Spotify / custom status
            type: boolean

  - name: theme
    label: Giao diện & thông tin site
    type: file
    path: _data/theme.yml
    format: yaml
    fields:
      - name: title
        label: Tên blog
        type: string
      - name: tagline
        label: Tagline (dòng dưới tên blog)
        type: string
      - name: description
        label: Mô tả site (hiện trên Google, khi chia sẻ link)
        type: text
      - name: author
        label: Tên tác giả (chân trang)
        type: string
      - name: avatar
        label: Avatar
        type: image
        options:
          path: assets/img
      - name: background
        label: Ảnh nền
        type: image
        options:
          path: assets/img/bg
      - name: overlay
        label: Độ tối phủ lên ảnh nền
        description: "Từ 0 (không phủ) đến 1 (đen hẳn). Mặc định 0.68"
        type: number
      - name: primary_color
        label: Màu chủ đạo
        description: "Mã màu hex, ví dụ #f2c230 (vàng), #4f8cff (xanh dương), #ff5c8a (hồng)"
        type: string
        pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
      - name: accent_color
        label: Màu phụ (chữ đậm, link khi rê chuột)
        description: Thường là bản sáng hơn của màu chủ đạo
        type: string
        pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
