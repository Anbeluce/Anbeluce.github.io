# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Open https://app.pagescms.org, sign in with GitHub and pick this repository.
# Every save is a commit; GitHub Actions then rebuilds the site.
#
# Saving a "file" entry (about, pinned_categories, contact, status, theme)
# rewrites it from this schema, so any YAML comment in those files is lost on
# the next save — put explanations in a field's `description` instead, which
# shows in the editor and never touches the file.

settings:
  commit:
    # {path} is the file touched; the rest are the defaults Pages CMS fills in.
    templates:
      create: "post: add {filename} (Pages CMS)"
      update: "post: update {filename} (Pages CMS)"
      delete: "post: remove {filename} (Pages CMS)"
      rename: "post: rename {oldPath} -> {newPath} (Pages CMS)"

media:
  input: assets/img
  output: /assets/img
  categories: [image, video, audio, document, font]
  rename: safe
  commit:
    templates:
      create: "media: add {filename} (Pages CMS)"
      update: "media: replace {filename} (Pages CMS)"
      delete: "media: remove {filename} (Pages CMS)"
      rename: "media: rename {oldPath} -> {newPath} (Pages CMS)"

# Reusable field group for a post's cover image, shared by both post collections below.
components:
  cover_image:
    type: object
    label: Ảnh bìa
    fields:
      - name: path
        label: Ảnh
        type: image
        options:
          path: assets/img/posts
      - name: alt
        label: Mô tả ảnh
        type: string

content:
  # ⭐ Default way to write: soạn như Word, không cần biết Markdown.
  # Chỉ mở "Bài viết (nâng cao)" khi bài cần khung ghi chú màu hoặc cú pháp
  # đặc biệt của theme — xem bài "Hướng dẫn đăng bài" để biết khi nào cần.
  - name: quick_posts
    label: "⭐ Viết bài"
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    view:
      primary: title
      fields: [title, date, draft]
      sort: date
      order: desc
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: description
        label: Mô tả ngắn
        type: text
      - name: date
        label: Ngày đăng
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss '+0700'"
      - name: categories
        label: Danh mục
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: image
        component: cover_image
      - name: pin
        label: Ghim lên đầu trang chủ
        type: boolean
      - name: draft
        label: Ẩn bài (nháp, chưa đăng)
        description: "Bật ô này để giấu bài khỏi toàn bộ site — bài không mất, chỉ không ai xem được ngoài bạn trong này. Tắt lại để đăng."
        type: boolean
      - name: body
        label: Nội dung
        type: rich-text
        options:
          format: markdown
          path: assets/img/posts
          rename: safe

  - name: posts
    label: Bài viết (nâng cao)
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: create
    view:
      primary: title
      fields: [title, date, categories, draft]
      sort: date
      order: desc
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: description
        label: Mô tả ngắn (hiện trên card trang chủ)
        type: text
      - name: date
        label: Ngày đăng
        type: date
        required: true
        options:
          time: true
          # Jekyll reads a date without offset as UTC, so pin Vietnam time explicitly
          format: "yyyy-MM-dd HH:mm:ss '+0700'"
      - name: categories
        label: Danh mục
        description: "Tối đa 2 cấp: mục cha rồi mục con, ví dụ: Cyber Defenders → Threat Hunting"
        type: string
        list: true
      - name: tags
        label: Tags
        description: "Viết thường, nối bằng dấu gạch ngang, ví dụ: endpoint-forensics"
        type: string
        list: true
      - name: image
        component: cover_image
      - name: pin
        label: Ghim lên đầu trang chủ
        type: boolean
      - name: draft
        label: Ẩn bài (nháp, chưa đăng)
        description: "Bật ô này để giấu bài khỏi toàn bộ site — bài không mất, chỉ không ai xem được ngoài bạn trong này. Tắt lại để đăng."
        type: boolean
      - name: body
        label: "Nội dung (Markdown thô — cho prompt box, aside, v.v. Xem bài Hướng dẫn đăng bài)"
        type: code
        options:
          format: markdown

  - name: about
    label: Trang About
    type: file
    path: _tabs/about.md
    format: yaml-frontmatter
    operations:
      delete: false # the theme's About tab needs this file to exist
    fields:
      - name: icon
        type: string
        hidden: true
      - name: order
        type: number
        hidden: true
      - name: body
        label: Nội dung (Markdown)
        type: code
        options:
          format: markdown

  - name: pinned_categories
    label: Card ghim trang chủ
    type: file
    path: _data/pinned_categories.yml
    format: yaml
    list: true
    operations:
      delete: false # the home layout reads this file; delete the rows inside instead
    fields:
      - name: title
        label: Tiêu đề
        type: string
        required: true
      - name: icon
        label: Icon Font Awesome
        description: "Ví dụ: fas fa-shield-halved — tra icon tại fontawesome.com/icons"
        type: string
      - name: category
        label: Danh mục liên kết
        description: Phải trùng với tên danh mục dùng trong bài viết
        type: string
        required: true
      - name: description
        label: Mô tả
        type: text
      - name: image
        label: Ảnh bìa
        type: image
        options:
          path: assets/img/posts

  - name: contact
    label: Icon mạng xã hội (sidebar)
    type: file
    path: _data/contact.yml
    format: yaml
    list: true
    operations:
      delete: false # the sidebar reads this file; delete the rows inside instead
    fields:
      - name: type
        label: Tên
        type: string
        required: true
      - name: icon
        label: Icon Font Awesome
        type: string
      - name: url
        label: Link
        description: Để trống với github/email (lấy từ _config.yml)
        type: string
      - name: noblank
        label: Mở trong tab hiện tại
        type: boolean

  - name: status
    label: Trạng thái online (sidebar)
    type: file
    path: _data/status.yml
    format: yaml
    operations:
      delete: false # the online-status include reads this file
    fields:
      - name: enabled
        label: Hiện khung trạng thái dưới tên blog
        type: boolean
      - name: github
        label: GitHub
        type: object
        fields:
          - name: enabled
            label: Hiện hoạt động gần nhất trên GitHub
            type: boolean
          - name: username
            label: Username GitHub
            type: string
      - name: discord
        label: Discord
        type: object
        fields:
          - name: enabled
            label: Hiện trạng thái online Discord
            description: "Phải tham gia server Lanyard trước: https://discord.gg/lanyard"
            type: boolean
          - name: user_id
            label: Discord User ID
            description: "Dãy số. Discord → Cài đặt → Nâng cao → bật Chế độ nhà phát triển, rồi chuột phải vào tên mình → Sao chép ID người dùng"
            type: string
          - name: show_activity
            label: Hiện đang chơi game / nghe Spotify / custom status
            type: boolean

  - name: theme
    label: Giao diện & thông tin site
    type: file
    path: _data/theme.yml
    format: yaml
    operations:
      delete: false # the theme-settings plugin and CSS read this file
    fields:
      - name: title
        label: Tên blog
        type: string
      - name: tagline
        label: Tagline (dòng dưới tên blog)
        type: string
      - name: description
        label: Mô tả site (hiện trên Google, khi chia sẻ link)
        type: text
      - name: author
        label: Tên tác giả (chân trang)
        type: string
      - name: avatar
        label: Avatar
        type: image
        options:
          path: assets/img
      - name: background
        label: Ảnh nền
        type: image
        options:
          path: assets/img/bg
      - name: overlay
        label: Độ tối phủ lên ảnh nền
        description: "Từ 0 (không phủ) đến 1 (đen hẳn). Mặc định 0.68"
        type: number
      - name: primary_color
        label: Màu chủ đạo
        description: "Mã màu hex, ví dụ #f2c230 (vàng), #4f8cff (xanh dương), #ff5c8a (hồng)"
        type: string
        pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
      - name: accent_color
        label: Màu phụ (chữ đậm, link khi rê chuột)
        description: Thường là bản sáng hơn của màu chủ đạo
        type: string
        pattern: "^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$"
      - name: font_body
        label: Font chữ nội dung
        description: "Tên font trên fonts.google.com, nên lọc Language: Vietnamese. Ví dụ: Be Vietnam Pro, Inter, Lexend, Nunito, Montserrat"
        type: string
      - name: font_heading
        label: Font tiêu đề
        description: Để trống thì dùng font nội dung
        type: string
      - name: font_code
        label: Font khối code
        description: "Ví dụ: JetBrains Mono, Fira Code, Source Code Pro"
        type: string
