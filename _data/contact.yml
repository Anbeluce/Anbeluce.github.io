#  The contact options (sidebar bottom icons).

- type: github
  icon: "fab fa-github"

- type: linkedin
  icon: "fab fa-linkedin"
  url: "https://www.linkedin.com/in/your-linkedin" # change to your LinkedIn

- type: facebook
